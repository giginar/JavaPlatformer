apply plugin: 'com.android.application'

configurations {
  natives
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
  namespace 'com.game.diver.android'
  compileSdk androidCompileSdk.toInteger()
  buildToolsVersion androidBuildToolsVersion

  defaultConfig {
    applicationId 'com.game.diver.deepdivedrift'
    minSdk androidMinSdk.toInteger()
    targetSdk androidTargetSdk.toInteger()
    versionCode androidVersionCode.toInteger()
    versionName projectVersion
  }

  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      assets.srcDirs = [rootProject.file('assets')]
      jniLibs.srcDirs = ['libs']
    }
  }

  signingConfigs {
    release {
      if (keystorePropertiesFile.exists()) {
        storeFile rootProject.file(keystoreProperties['storeFile'])
        storePassword keystoreProperties['storePassword']
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
      }
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix '-debug'
    }
    release {
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (keystorePropertiesFile.exists()) {
        signingConfig signingConfigs.release
      }
    }
  }

  bundle {
    language {
      enableSplit = false
    }
  }

  packaging {
    jniLibs {
      useLegacyPackaging = false
    }
  }
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:$gdxControllersVersion"
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
  inputs.files configurations.natives
  outputs.dir file('libs')

  doLast {
    def architectureDirectories = [
      'armeabi-v7a': file('libs/armeabi-v7a'),
      'arm64-v8a': file('libs/arm64-v8a'),
      'x86': file('libs/x86'),
      'x86_64': file('libs/x86_64')
    ]
    delete architectureDirectories.values()
    architectureDirectories.values().each { it.mkdirs() }

    configurations.natives.files.each { nativeJar ->
      def architecture = architectureDirectories.keySet().find {
        nativeJar.name.endsWith("natives-${it}.jar")
      }
      if (architecture != null) {
        copy {
          from zipTree(nativeJar)
          into architectureDirectories[architecture]
          include '*.so'
        }
      }
    }
  }
}

tasks.configureEach { task ->
  if (task.name.startsWith('merge') && task.name.endsWith('JniLibFolders')) {
    task.dependsOn tasks.named('copyAndroidNatives')
  }
}

tasks.register('prepareGooglePlayBundle', Copy) {
  dependsOn 'bundleRelease'
  group = 'distribution'
  description = 'Copies the release AAB to a clearly named Google Play delivery directory.'
  from layout.buildDirectory.file('outputs/bundle/release/android-release.aab')
  into layout.buildDirectory.dir('store/google-play')
  rename {
    "DeepDiveDrift-${projectVersion}-google-play${keystorePropertiesFile.exists() ? '' : '-unsigned'}.aab"
  }
}

eclipse.project.name = appName + '-android'
